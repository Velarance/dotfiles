# =====================================================
# Hyprland Autostart Configuration
# =====================================================

# Core System Services
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP && systemctl --user start swaync.service polkit-gnome-authentication-agent.service
exec-once = command -v nm-applet >/dev/null 2>&1 && nm-applet --indicator
exec-once = command -v swayosd-server >/dev/null 2>&1 && swayosd-server --style ${HOME}/.config/swayosd/style.css --top-margin 0.9
exec-once = command -v easyeffects >/dev/null 2>&1 && easyeffects --hide-window
exec-once = command -v eww >/dev/null 2>&1 && eww daemon

# Clipboard Manager
exec-once = wl-paste --watch cliphist store

# Screen-time tracker (FocusTime)
exec-once = command -v python3 >/dev/null 2>&1 && [ -x ${HOME}/.config/hypr/scripts/focustime-daemon.py ] && ${HOME}/.config/hypr/scripts/focustime-daemon.py

# Status Bar
exec-once = ${HOME}/dotfiles/config/waybar/launch.sh

# Dropdown terminal
exec-once = sleep 1 && kitty --class dropdown-terminal

# =====================================================
# Complex Logic (GTK, Wallpaper, etc.)
# =====================================================
exec-once = ${HOME}/dotfiles/config/hypr/scripts/autostart.sh
